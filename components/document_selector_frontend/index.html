<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #657086;
        --line: #e4e8ef;
        --panel: #ffffff;
        --soft: #f6f8fb;
        --accent: #635bff;
        --accent-dark: #5148e5;
        --selection: #dcd9ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        background: transparent;
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      }

      .viewer {
        position: relative;
        height: 720px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 12px 36px rgba(28, 38, 58, 0.07);
      }

      .filebar {
        display: flex;
        height: 60px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      .filebar-title {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 10px;
      }

      .file-icon {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 34px;
        place-items: center;
        border: 1px solid #cfe0f3;
        border-radius: 9px;
        background: #f3f8fd;
        color: #0f5c9e;
      }

      .title-wrap { min-width: 0; }

      .eyebrow {
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      h1 {
        overflow: hidden;
        margin: 0;
        font-size: 14px;
        font-weight: 720;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .selection-hint {
        flex: 0 0 auto;
        padding: 7px 10px;
        border-radius: 999px;
        border: 1px solid #d7e2ef;
        background: #f8fbfe;
        color: #285d8f;
        font-size: 12px;
        font-weight: 600;
      }

      .workspace {
        display: grid;
        height: 660px;
        min-height: 0;
        overflow: hidden;
        grid-template-columns: 205px minmax(0, 1fr);
      }

      .library {
        overflow-y: auto;
        padding: 15px 12px;
        border-right: 1px solid var(--line);
        background: #f8fafc;
      }

      .library-heading {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 15px;
        padding: 0 4px 13px;
        border-bottom: 1px solid #e1e8f0;
      }

      .library-heading strong { display: block; font-size: 13px; }
      .library-heading span { color: var(--muted); font-size: 10px; }

      .day-card {
        margin-bottom: 10px;
        overflow: hidden;
        border: 1px solid #dbe4ee;
        border-radius: 12px;
        background: #fff;
      }

      .day-card.active {
        border-color: #88b7dc;
        box-shadow: 0 0 0 2px rgba(79,151,205,.1);
      }

      .day-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 12px;
        font-size: 12px;
        font-weight: 750;
      }

      .day-title small {
        display: block;
        margin-top: 2px;
        color: #8a9bb0;
        font-size: 9px;
        font-weight: 600;
        text-transform: uppercase;
      }

      .studying {
        padding: 3px 6px;
        border-radius: 99px;
        background: #e8f2fb;
        color: #155b94;
        font-size: 9px;
      }

      .material-file {
        margin: 0 8px 8px;
        padding: 9px;
        border: 1px solid #a9c9e6;
        border-radius: 9px;
        background: #edf5fc;
        color: #174f80;
      }

      .material-file strong {
        display: block;
        overflow: hidden;
        font-size: 10px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .material-file span { color: #7890a7; font-size: 9px; }

      .topic-heading {
        margin: 15px 4px 7px;
        color: #7d8da1;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
      }

      .topic {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 7px;
        margin-bottom: 4px;
        padding: 8px 9px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #53657a;
        cursor: pointer;
        font: 600 10px/1.3 inherit;
        text-align: left;
      }

      .topic:hover, .topic.active { background: #e9f1f8; color: #155b94; }

      .reader {
        display: flex;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        flex-direction: column;
        background: #edf2f7;
      }

      .reader-toolbar {
        z-index: 5;
        display: flex;
        min-height: 50px;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 10px 0;
        padding: 6px 9px;
        border: 1px solid #d9e2ec;
        border-radius: 12px;
        background: rgba(255,255,255,.97);
        box-shadow: 0 4px 14px rgba(41,56,78,.08);
      }

      .tool-group { display: flex; align-items: center; gap: 5px; }

      .tool-button, .zoom-control {
        height: 34px;
        padding: 0 10px;
        border: 1px solid #dce5ef;
        border-radius: 9px;
        background: #fff;
        color: #4b5d72;
        font: 650 10px/1 inherit;
        cursor: pointer;
      }

      .tool-button.active {
        border-color: #9dbfe0;
        background: #edf5fc;
        color: #145991;
      }

      .page-status {
        padding: 7px 10px;
        border-radius: 8px;
        background: #f5f8fb;
        color: #245b8c;
        font-size: 10px;
        font-weight: 750;
      }

      .document-scroll {
        min-height: 0;
        flex: 1;
        overflow-y: scroll;
        overscroll-behavior: contain;
        touch-action: pan-y;
        padding: 14px 16px 70px;
        scroll-behavior: smooth;
        scrollbar-color: #8f9ba8 #e3e9ef;
        scrollbar-width: auto;
      }

      .document-scroll::-webkit-scrollbar { width: 12px; }
      .document-scroll::-webkit-scrollbar-track { background: #e3e9ef; }
      .document-scroll::-webkit-scrollbar-thumb {
        border: 3px solid #e3e9ef;
        border-radius: 99px;
        background: #8f9ba8;
      }

      article {
        max-width: 780px;
        margin: 0 auto;
        cursor: text;
        font-family: inherit;
      }

      .page-card {
        margin: 0 0 16px;
        padding: 12px 14px 14px;
        border: 1px solid #d8e0e8;
        border-radius: 14px;
        background: #fffef9;
        box-shadow: 0 3px 9px rgba(31,44,64,.07);
      }

      .page-card.focused { border-color: #67a7d8; box-shadow: 0 0 0 2px rgba(79,151,205,.1); }

      .page-meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
        color: #8294aa;
        font-size: 9px;
      }

      .page-text {
        max-width: 650px;
        color: #172033;
        font-size: 15px;
        line-height: 1.65;
        white-space: pre-line;
      }

      .slide-canvas {
        position: relative;
        width: 100%;
        overflow: hidden;
        border: 1px solid #dbe3eb;
        border-radius: 5px;
        background: #fff;
      }

      .slide-image {
        display: block;
        width: 100%;
        height: auto;
        max-width: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      .text-layer {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 3;
        transform-origin: 0 0;
        user-select: text;
      }

      .text-layer span {
        position: absolute;
        overflow: hidden;
        color: transparent;
        cursor: text;
        line-height: 1;
        white-space: pre;
        user-select: text;
      }

      .text-layer span::selection { background: rgba(121, 153, 255, .48); }

      .empty-page {
        display: grid;
        min-height: 190px;
        place-items: center;
        color: #9aa8b8;
        font-size: 11px;
      }

      .reader-footer {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 205px;
        z-index: 7;
        display: flex;
        height: 48px;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border-top: 1px solid #dfe6ee;
        background: rgba(255,255,255,.96);
        color: #53657b;
        font-size: 11px;
      }

      .pager-button {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border: 1px solid #d8e3ee;
        border-radius: 50%;
        background: #fff;
        color: #245b8c;
        cursor: pointer;
      }

      article::selection, article *::selection { background: var(--selection); }
      ::highlight(active-passage) {
        background: #ccc8ff;
        color: inherit;
      }

      .selection-overlay {
        position: absolute;
        z-index: 2;
        border-radius: 3px;
        background: #ccc8ff;
        pointer-events: none;
        mix-blend-mode: multiply;
      }

      .popover {
        position: absolute;
        z-index: 20;
        display: none;
        width: min(360px, calc(100% - 28px));
        padding: 12px;
        border: 1px solid #dfe3eb;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 18px 50px rgba(20, 29, 47, .18);
      }

      .popover.visible { display: block; animation: rise .15s ease-out; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .popover-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 750;
      }

      .close {
        display: grid;
        width: 24px;
        height: 24px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 18px;
      }

      .close:hover { background: var(--soft); }

      .input-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      textarea {
        width: 100%;
        min-height: 42px;
        max-height: 72px;
        resize: none;
        padding: 10px 11px;
        border: 1px solid #d7dce6;
        border-radius: 10px;
        outline: none;
        color: var(--ink);
        font: 14px/1.4 "Segoe UI", Tahoma, Arial, sans-serif;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(99, 91, 255, .12);
      }

      .send {
        display: grid;
        width: 42px;
        height: 42px;
        flex: 0 0 42px;
        place-items: center;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      .send:hover { background: var(--accent-dark); }
      .send:disabled { cursor: not-allowed; opacity: .45; }

      .help {
        margin: 7px 2px 0;
        color: var(--muted);
        font-size: 11px;
      }

      @media (max-width: 640px) {
        .selection-hint { display: none; }
        .workspace { grid-template-columns: 1fr; }
        .library { display: none; }
        .reader-footer { left: 0; }
        .document-scroll { padding-inline: 8px; }
        .tool-button.optional { display: none; }
      }
    </style>
  </head>
  <body>
    <section class="viewer" id="viewer">
      <header class="filebar">
        <div class="filebar-title">
          <span class="file-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
          </span>
          <div class="title-wrap">
            <p class="eyebrow">AI &amp; LLM Foundation · Lecture material</p>
            <h1 id="document-title"></h1>
          </div>
        </div>
        <span class="selection-hint">Bôi đen để đặt câu hỏi</span>
      </header>

      <div class="workspace">
        <aside class="library">
          <div class="library-heading">
            <span class="file-icon" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
            </span>
            <div><strong>Học liệu môn học</strong><span>Chương, slide và tài liệu</span></div>
          </div>

          <div class="day-card">
            <div class="day-title">
              <div>◉&nbsp; Day 1<small>1 tài liệu · active</small></div>
              <span class="studying">STUDYING</span>
            </div>
            <div class="material-file">
              <strong id="sidebar-file-name"></strong>
              <span id="sidebar-page-count"></span>
            </div>
          </div>

          <p class="topic-heading">Nội dung bài học</p>
          <button class="topic" data-page="3" type="button">◉ Lịch sử AI</button>
          <button class="topic" data-page="8" type="button">◉ Hệ chuyên gia</button>
          <button class="topic" data-page="12" type="button">◉ AlexNet &amp; Deep Learning</button>
          <button class="topic" data-page="14" type="button">◉ Transformer &amp; LLM</button>
        </aside>

        <main class="reader">
          <nav class="reader-toolbar" aria-label="Thanh công cụ tài liệu">
            <div class="tool-group">
              <button class="tool-button active" type="button">⌁ Đọc</button>
              <button class="tool-button optional" type="button">✎ Bút</button>
              <button class="tool-button optional active" type="button">⌁ Highlight</button>
            </div>
            <div class="tool-group">
              <span class="page-status" id="page-status">Trang 1</span>
              <button class="zoom-control" id="zoom-out" type="button">−</button>
              <span class="page-status" id="zoom-label">100%</span>
              <button class="zoom-control" id="zoom-in" type="button">＋</button>
            </div>
          </nav>

          <div class="document-scroll" id="document-scroll">
            <article id="document" tabindex="0"></article>
          </div>
        </main>
      </div>

      <footer class="reader-footer">
        <button class="pager-button" id="previous-page" type="button" aria-label="Trang trước">‹</button>
        <span>Trang&nbsp; <strong id="footer-current-page">1</strong>&nbsp; / &nbsp;<span id="footer-total-pages">1</span></span>
        <button class="pager-button" id="next-page" type="button" aria-label="Trang sau">›</button>
      </footer>

      <form class="popover" id="popover">
        <div class="popover-label">
          <span>Hỏi về đoạn này</span>
          <button class="close" id="close" type="button" aria-label="Đóng">×</button>
        </div>
        <div class="input-row">
          <textarea id="question" rows="1" placeholder="Nhập câu hỏi của bạn…" aria-label="Câu hỏi"></textarea>
          <button class="send" id="send" type="submit" disabled aria-label="Gửi câu hỏi">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
        <p class="help">Enter để gửi · Shift + Enter để xuống dòng</p>
      </form>
    </section>

    <script>
      const API_VERSION = 1;
      const viewer = document.getElementById("viewer");
      const scroller = document.getElementById("document-scroll");
      const article = document.getElementById("document");
      const title = document.getElementById("document-title");
      const popover = document.getElementById("popover");
      const question = document.getElementById("question");
      const send = document.getElementById("send");
      const close = document.getElementById("close");
      const sidebarFileName = document.getElementById("sidebar-file-name");
      const sidebarPageCount = document.getElementById("sidebar-page-count");
      const pageStatus = document.getElementById("page-status");
      const footerCurrentPage = document.getElementById("footer-current-page");
      const footerTotalPages = document.getElementById("footer-total-pages");
      const previousPage = document.getElementById("previous-page");
      const nextPage = document.getElementById("next-page");
      const zoomOut = document.getElementById("zoom-out");
      const zoomIn = document.getElementById("zoom-in");
      const zoomLabel = document.getElementById("zoom-label");

      let selectedText = "";
      let anchorRect = null;
      let selectedRange = null;
      let selectedPageNumber = null;
      let suggestedQuestion = "";
      let currentPage = 1;
      let totalPages = 1;
      let zoomLevel = 100;
      let lastPayload = "";

      function post(type, payload = {}) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
      }

      function setFrameHeight() {
        post("streamlit:setFrameHeight", { height: 736 });
      }

      function hidePopover(clearSelection = false) {
        popover.classList.remove("visible");
        popover.style.visibility = "";
        popover.style.width = "";
        question.value = "";
        send.disabled = true;
        if (clearSelection) window.getSelection()?.removeAllRanges();
      }

      function clearOverlayHighlight() {
        viewer.querySelectorAll(".selection-overlay").forEach((node) => node.remove());
      }

      function renderOverlayHighlight() {
        clearOverlayHighlight();
        if (!selectedRange) return;
        const viewerRect = viewer.getBoundingClientRect();
        selectedRange.getClientRects().forEach((rect) => {
          if (!rect.width || !rect.height) return;
          const overlay = document.createElement("span");
          overlay.className = "selection-overlay";
          overlay.style.left = `${rect.left - viewerRect.left}px`;
          overlay.style.top = `${rect.top - viewerRect.top}px`;
          overlay.style.width = `${rect.width}px`;
          overlay.style.height = `${rect.height}px`;
          viewer.appendChild(overlay);
        });
      }

      function persistHighlight(range) {
        selectedRange = range.cloneRange();
        if (window.CSS?.highlights && window.Highlight) {
          CSS.highlights.set("active-passage", new Highlight(selectedRange));
          clearOverlayHighlight();
        } else {
          renderOverlayHighlight();
        }
      }

      function positionPopover(rect) {
        const viewerRect = viewer.getBoundingClientRect();
        const scrollRect = scroller.getBoundingClientRect();
        const gap = 12;
        const bounds = {
          left: scrollRect.left - viewerRect.left + gap,
          right: scrollRect.right - viewerRect.left - gap,
          top: scrollRect.top - viewerRect.top + gap,
          bottom: scrollRect.bottom - viewerRect.top - gap,
        };
        const selection = {
          left: rect.left - viewerRect.left,
          right: rect.right - viewerRect.left,
          top: rect.top - viewerRect.top,
          bottom: rect.bottom - viewerRect.top,
          width: rect.width,
          height: rect.height,
        };

        popover.style.width = `${Math.min(340, scrollRect.width - gap * 2)}px`;
        const width = popover.offsetWidth;
        const height = popover.offsetHeight;
        const clamp = (value, minimum, maximum) => Math.max(minimum, Math.min(value, maximum));
        const overlapsSelection = (candidate) => !(
          candidate.left + width + gap <= selection.left
          || candidate.left >= selection.right + gap
          || candidate.top + height + gap <= selection.top
          || candidate.top >= selection.bottom + gap
        );
        const fits = (candidate) => (
          candidate.left >= bounds.left
          && candidate.left + width <= bounds.right
          && candidate.top >= bounds.top
          && candidate.top + height <= bounds.bottom
          && !overlapsSelection(candidate)
        );
        const centeredTop = clamp(
          selection.top + selection.height / 2 - height / 2,
          bounds.top,
          bounds.bottom - height,
        );
        const centeredLeft = clamp(
          selection.left + selection.width / 2 - width / 2,
          bounds.left,
          bounds.right - width,
        );
        const candidates = [
          { left: selection.right + gap, top: centeredTop },
          { left: selection.left - width - gap, top: centeredTop },
          { left: centeredLeft, top: selection.bottom + gap },
          { left: centeredLeft, top: selection.top - height - gap },
        ];
        let position = candidates.find(fits);

        if (!position) {
          const libraryRect = document.querySelector(".library").getBoundingClientRect();
          if (libraryRect.width > 80) {
            popover.style.width = `${Math.max(170, libraryRect.width - 20)}px`;
            const sidebarHeight = popover.offsetHeight;
            position = {
              left: libraryRect.left - viewerRect.left + 10,
              top: clamp(
                selection.top + selection.height / 2 - sidebarHeight / 2,
                libraryRect.top - viewerRect.top + 10,
                libraryRect.bottom - viewerRect.top - sidebarHeight - 10,
              ),
            };
          } else {
            position = candidates[2];
          }
        }

        popover.style.left = `${position.left}px`;
        popover.style.top = `${position.top}px`;
      }

      function captureSelection() {
        const selection = window.getSelection();
        if (!selection || selection.isCollapsed || !selection.rangeCount) return;
        const range = selection.getRangeAt(0);
        if (!article.contains(range.commonAncestorContainer)) return;
        const startElement = range.startContainer.nodeType === Node.ELEMENT_NODE
          ? range.startContainer
          : range.startContainer.parentElement;
        const pageCard = startElement?.closest('.page-card');
        selectedPageNumber = Number(pageCard?.dataset.page || currentPage);
        const text = selection.toString().replace(/\s+/g, " ").trim();
        if (!text) return;
        selectedText = text;
        persistHighlight(range);
        popover.style.visibility = "hidden";
        popover.classList.add("visible");
        if (!question.value.trim() && suggestedQuestion) {
          question.value = suggestedQuestion;
          question.dispatchEvent(new Event("input"));
        }
        requestAnimationFrame(() => {
          anchorRect = selectedRange.getBoundingClientRect();
          positionPopover(anchorRect);
          popover.style.visibility = "visible";
          question.focus();
        });
      }

      function updatePageIndicators(pageNumber) {
        currentPage = Math.max(1, Math.min(Number(pageNumber) || 1, totalPages));
        pageStatus.textContent = `Trang ${currentPage} / ${totalPages} · Cuộn dọc`;
        footerCurrentPage.textContent = currentPage;
        footerTotalPages.textContent = totalPages;
        document.querySelectorAll(".topic").forEach((button) => {
          const targetPage = Number(button.dataset.page);
          const nextPage = button.nextElementSibling
            ? Number(button.nextElementSibling.dataset?.page || totalPages + 1)
            : totalPages + 1;
          button.classList.toggle("active", currentPage >= targetPage && currentPage < nextPage);
        });
      }

      function scrollToPage(pageNumber, behavior = "smooth") {
        const target = article.querySelector(`.page-card[data-page="${pageNumber}"]`);
        if (!target) return;
        scroller.scrollTo({ top: Math.max(0, target.offsetTop - 72), behavior });
        updatePageIndicators(pageNumber);
      }

      function detectCurrentPage() {
        const scrollerRect = scroller.getBoundingClientRect();
        let closestPage = currentPage;
        let closestDistance = Number.POSITIVE_INFINITY;
        article.querySelectorAll(".page-card").forEach((card) => {
          const distance = Math.abs(card.getBoundingClientRect().top - scrollerRect.top - 18);
          if (distance < closestDistance) {
            closestDistance = distance;
            closestPage = Number(card.dataset.page);
          }
        });
        updatePageIndicators(closestPage);
      }

      function setZoom(nextZoom) {
        zoomLevel = Math.max(80, Math.min(130, nextZoom));
        article.style.zoom = zoomLevel / 100;
        zoomLabel.textContent = `${zoomLevel}%`;
        requestAnimationFrame(syncTextLayers);
      }

      function syncTextLayers() {
        article.querySelectorAll(".slide-canvas").forEach((canvas) => {
          const layer = canvas.querySelector(".text-layer");
          if (!layer) return;
          const sourceWidth = Number(layer.dataset.sourceWidth) || 1;
          const scale = canvas.clientWidth / sourceWidth;
          layer.style.transform = `scale(${scale})`;
        });
      }

      function renderLibrary(documents, activeDocumentId) {
        const heading = document.querySelector('.topic-heading');
        if (!heading) return;
        document.querySelectorAll('.day-card').forEach((node) => node.remove());
        const items = Array.isArray(documents) ? documents : [];
        items.forEach((item) => {
          const card = document.createElement('div');
          card.className = 'day-card';
          if (String(item.course_id) === String(activeDocumentId)) {
            card.classList.add('active');
          }

          const cardTitle = document.createElement('div');
          cardTitle.className = 'day-title';
          const label = document.createElement('div');
          label.textContent = `◉ ${item.day_label || item.course_id}`;
          const summary = document.createElement('small');
          summary.textContent = `${Number(item.page_count) || 0} trang`;
          label.appendChild(summary);
          cardTitle.appendChild(label);
          if (card.classList.contains('active')) {
            const badge = document.createElement('span');
            badge.className = 'studying';
            badge.textContent = 'ĐANG HỌC';
            cardTitle.appendChild(badge);
          }
          card.appendChild(cardTitle);

          const material = document.createElement('div');
          material.className = 'material-file';
          const filename = document.createElement('strong');
          filename.textContent = item.name || 'Tài liệu học tập';
          const pageCount = document.createElement('span');
          pageCount.textContent = `${Number(item.page_count) || 0} trang`;
          material.append(filename, pageCount);
          card.appendChild(material);
          heading.before(card);
        });
      }

      function renderDocument(args) {
        const payload = JSON.stringify([
          args.title,
          args.document,
          args.pages,
          args.question_placeholder,
          args.focus_page,
          args.library_documents,
          args.active_document_id,
        ]);
        if (payload === lastPayload) return;
        lastPayload = payload;
        renderLibrary(args.library_documents, args.active_document_id);
        title.textContent = args.title || "Tài liệu học tập";
        sidebarFileName.textContent = args.title || "Tài liệu học tập";
        suggestedQuestion = args.question_placeholder || "";
        question.placeholder = suggestedQuestion || "Nhập câu hỏi của bạn…";
        article.replaceChildren();
        selectedRange = null;
        window.CSS?.highlights?.delete("active-passage");
        clearOverlayHighlight();
        const pages = Array.isArray(args.pages) && args.pages.length
          ? args.pages
          : String(args.document || "")
              .split(/\n\s*\n/)
              .filter(Boolean)
              .map((text, index) => ({ page_number: index + 1, text }));
        totalPages = pages.length || 1;
        sidebarPageCount.textContent = `${totalPages} trang`;
        pages.forEach((pageData) => {
          const pageNumber = Number(pageData.page_number);
          const pageCard = document.createElement("section");
          pageCard.className = "page-card";
          pageCard.dataset.page = pageNumber;

          const meta = document.createElement("div");
          meta.className = "page-meta";
          meta.innerHTML = `<span>Trang ${pageNumber} / ${totalPages}</span><span></span>`;
          meta.lastElementChild.textContent = args.title || "Tài liệu học tập";
          pageCard.appendChild(meta);

          const pageText = document.createElement("div");
          if (pageData.image) {
            pageText.className = "slide-canvas";

            const image = document.createElement("img");
            image.className = "slide-image";
            image.src = String(pageData.image);
            image.alt = `Slide trang ${pageNumber}`;
            image.draggable = false;
            image.addEventListener("load", syncTextLayers, { once: true });
            pageText.appendChild(image);

            const textLayer = document.createElement("div");
            textLayer.className = "text-layer";
            textLayer.dataset.sourceWidth = Number(pageData.width) || 1920;
            textLayer.style.width = `${Number(pageData.width) || 1920}px`;
            textLayer.style.height = `${Number(pageData.height) || 1080}px`;
            (Array.isArray(pageData.words) ? pageData.words : []).forEach((word) => {
              const wordNode = document.createElement("span");
              const wordHeight = Math.max(1, Number(word.y1) - Number(word.y0));
              wordNode.textContent = `${word.text} `;
              wordNode.style.left = `${Number(word.x0)}px`;
              wordNode.style.top = `${Number(word.y0)}px`;
              wordNode.style.width = `${Math.max(1, Number(word.x1) - Number(word.x0) + wordHeight * .32)}px`;
              wordNode.style.height = `${wordHeight * 1.15}px`;
              wordNode.style.fontSize = `${wordHeight * .9}px`;
              textLayer.appendChild(wordNode);
            });
            pageText.appendChild(textLayer);
          } else if (String(pageData.text || "").trim()) {
            pageText.className = "page-text";
            pageText.textContent = String(pageData.text).trim();
          } else {
            pageText.className = "empty-page";
            pageText.textContent = "Trang này không có lớp văn bản để bôi đen.";
          }
          pageCard.appendChild(pageText);
          article.appendChild(pageCard);
        });
        setZoom(100);
        requestAnimationFrame(syncTextLayers);
        updatePageIndicators(1);
        if (args.focus_page) {
          const target = article.querySelector(`.page-card[data-page="${args.focus_page}"]`);
          if (target) {
            target.classList.add("focused");
            scrollToPage(args.focus_page, "auto");
          }
        } else {
          scroller.scrollTop = 0;
        }
        hidePopover(true);
      }

      article.addEventListener("mouseup", () => setTimeout(captureSelection, 0));
      article.addEventListener("keyup", () => setTimeout(captureSelection, 0));
      scroller.addEventListener("scroll", () => {
        if (popover.classList.contains("visible") && anchorRect) hidePopover(false);
        if (!(window.CSS?.highlights && window.Highlight)) renderOverlayHighlight();
        detectCurrentPage();
      });

      document.querySelectorAll(".topic").forEach((button) => {
        button.addEventListener("click", () => scrollToPage(Number(button.dataset.page)));
      });
      previousPage.addEventListener("click", () => scrollToPage(currentPage - 1));
      nextPage.addEventListener("click", () => scrollToPage(currentPage + 1));
      zoomOut.addEventListener("click", () => setZoom(zoomLevel - 10));
      zoomIn.addEventListener("click", () => setZoom(zoomLevel + 10));

      window.addEventListener("resize", () => {
        if (!(window.CSS?.highlights && window.Highlight)) renderOverlayHighlight();
        syncTextLayers();
      });

      question.addEventListener("input", () => {
        send.disabled = !question.value.trim();
        question.style.height = "auto";
        question.style.height = `${Math.min(question.scrollHeight, 72)}px`;
      });

      question.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          if (question.value.trim()) popover.requestSubmit();
        }
      });

      close.addEventListener("click", () => hidePopover(true));
      popover.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = question.value.trim();
        if (!text || !selectedText) return;
        post("streamlit:setComponentValue", {
          value: {
            event_id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
            selected_text: selectedText,
            page_number: selectedPageNumber,
            question: text,
          },
        });
        hidePopover(true);
      });

      window.addEventListener("message", (event) => {
        if (event.data?.type !== "streamlit:render") return;
        renderDocument(event.data.args || {});
        setFrameHeight();
      });

      post("streamlit:componentReady", { apiVersion: API_VERSION });
      setFrameHeight();
    </script>
  </body>
</html>
